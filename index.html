<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Meter · Sign in</title>
<style>
:root{--bg:#F2F4F7;--card:#fff;--border:#EAECF0;--text:#101828;--text2:#475467;--text3:#667085;--brand:#1570EF;--brand-50:#EFF8FF;--red:#D92D20;--red-50:#FEF3F2;--green:#079455;--green-50:#ECFDF3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding:24px}
.box{width:100%;max-width:400px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(16,24,40,.08);padding:28px}
h1{font-size:20px;margin:0 0 4px}
p.sub{margin:0 0 22px;color:var(--text2)}
.tabs{display:flex;gap:4px;background:#F2F4F7;border-radius:8px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:transparent;height:34px;border-radius:6px;font:inherit;font-weight:600;color:var(--text2);cursor:pointer}
.tabs button[aria-selected=true]{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.08)}
label{display:block;font-weight:600;font-size:13px;color:#344054;margin:12px 0 6px}
input{width:100%;height:40px;border:1px solid #D0D5DD;border-radius:8px;padding:0 12px;font:inherit}
input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.btn{width:100%;height:40px;margin-top:18px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.msg{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:13px}
.msg.err{background:var(--red-50);color:#B42318}.msg.ok{background:var(--green-50);color:#067647}
.foot{margin-top:18px;color:var(--text3);font-size:12px;text-align:center}
</style>
</head>
<body>
<main class="box">
  <h1>Smart Meter</h1>
  <p class="sub">See your electricity use and which appliances are on.</p>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tIn" aria-selected="true">Sign in</button>
    <button type="button" role="tab" id="tUp" aria-selected="false">Create account</button>
  </div>
  <form id="f" novalidate>
    <div id="nameRow" hidden>
      <label for="name">Full name</label>
      <input id="name" autocomplete="name">
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" minlength="6" required>
    <button class="btn" id="go" type="submit">Sign in</button>
    <div class="msg" id="msg" hidden role="status"></div>
  </form>
  <p class="foot">Your meter is linked to your account by the administrator.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const $ = id => document.getElementById(id);
let mode = 'in';
function setMode(m) {
  mode = m;
  $('tIn').setAttribute('aria-selected', m === 'in'); $('tUp').setAttribute('aria-selected', m === 'up');
  $('nameRow').hidden = m === 'in'; $('go').textContent = m === 'in' ? 'Sign in' : 'Create account';
  $('pw').autocomplete = m === 'in' ? 'current-password' : 'new-password'; $('msg').hidden = true;
}
$('tIn').onclick = () => setMode('in'); $('tUp').onclick = () => setMode('up');
const show = (t, cls) => { const m = $('msg'); m.textContent = t; m.className = 'msg ' + cls; m.hidden = false; };

async function goHome() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const { data: p } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
  location.replace(p && p.role === 'admin' ? 'admin.html' : 'dashboard.html');
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('email').value.trim(), password = $('pw').value;
  if (!email || password.length < 6) { show('Enter your email and a password of at least 6 characters.', 'err'); return; }
  $('go').disabled = true;
  try {
    if (mode === 'in') {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await goHome();
    } else {
      const { data, error } = await sb.auth.signUp({ email, password,
        options: { data: { full_name: $('name').value.trim() }, emailRedirectTo: location.href.replace(/[^/]*$/, 'index.html') } });
      if (error) throw error;
      if (data.session) await goHome();
      else { show('Account created. Check your email for a confirmation link, then sign in.', 'ok'); setMode('in'); }
    }
  } catch (err) { show(err.message || 'Something went wrong. Try again.', 'err'); }
  $('go').disabled = false;
});
goHome();
</script>
</body>
</html>
